name: scverse
channels:
  - nvidia
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pip

# --- Core scverse Ecosystem ---
  - scanpy
  - anndata
  - mudata
  - spatialdata
  - scvi-tools
  - squidpy
  - muon
  - harmonypy 
  
